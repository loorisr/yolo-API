name: docker-publish

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # glibc ONNX Runtime for the Go integration test (taken from the PyPI wheel).
  ORT_VERSION: "1.31.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fetch ONNX Runtime
        run: |
          d="$RUNNER_TEMP/ort"
          python3 -m pip download --quiet --no-deps --only-binary=:all: \
            --platform manylinux_2_28_x86_64 --python-version 3.12 \
            -d "$d" "onnxruntime==${ORT_VERSION}"
          unzip -q -j "$d"/onnxruntime-*.whl 'onnxruntime/capi/libonnxruntime.so*' -d "$d/lib"
          echo "ORT_LIB_PATH=$(ls "$d"/lib/libonnxruntime.so.*)" >> "$GITHUB_ENV"
      - name: Integration test (real model inference)
        env:
          MODEL_PATH: models/yolo26n.onnx
        run: |
          go test -count=1 -run TestORTDetectBus -v ./internal/detector/ | tee "$RUNNER_TEMP/it.log"
          # The test skips itself without ORT; in CI a skip means it never ran.
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/it.log"; then
            echo "::error::integration test was skipped"; exit 1
          fi
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/server ./cmd/server
      - name: API test against the local server
        env:
          MODEL_PATH: models/yolo26n.onnx
          ADDR: ":8080"
          POOL_SIZE: "2"
        run: |
          /tmp/server > "$RUNNER_TEMP/server.log" 2>&1 &
          scripts/test-api.sh -i tests/testdata/bus.jpg --wait 60 --bench 3 \
            || { cat "$RUNNER_TEMP/server.log"; exit 1; }

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag
            type=ref,event=branch
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: yolo-api:ci
          cache-from: type=gha
      - name: Smoke test the image
        run: |
          docker run -d --name yolo-api -p 8080:8080 yolo-api:ci
          scripts/test-api.sh -i tests/testdata/bus.jpg --wait 90 --bench 3 \
            || { docker logs yolo-api; exit 1; }
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
